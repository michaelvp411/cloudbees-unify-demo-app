apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

# Reusable application deployer, called by the staged release workflows.
#
# The release is five services. The job graph below IS the dependency order
# from manifests/finsure-release-manifest.yaml (keep the two in sync):
#
#   catalog-service ──► orders-api ──┐
#   payments-service ────────────────┴──► checkout-service
#   notifications-service  (independent)
#
# Services with no `needs` deploy in parallel. If a service fails, Unify skips
# everything that depends on it; independent services still deploy.
#
# orders-api is the real component: its version comes from the release
# manifest, which Unify generates on release:
#   manifest["<component-name>"]["<artifact-name>"].{ deploy, version, url, id, ... }
# The <component-name> is the connected repo/component name, here
# "cloudbees-unify-demo-kit". If you fork to a different repo/component name,
# update the top-level key below (and the cross-repo uses path).
#
# The other four services have no component repo in this demo, so they are
# simulated by deploy-service.yaml with pinned versions.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true
      simulate-failure:
        type: string
        default: none

jobs:
  catalog-service:
    uses: ./.cloudbees/workflows/deploy-service.yaml
    with:
      service: catalog-service
      version: 3.8.0
      environment: ${{ inputs.environment }}

  payments-service:
    uses: ./.cloudbees/workflows/deploy-service.yaml
    with:
      service: payments-service
      version: 2.4.0
      rollback-version: 2.3.1
      environment: ${{ inputs.environment }}
      fail-in: ${{ inputs.simulate-failure }}

  notifications-service:
    uses: ./.cloudbees/workflows/deploy-service.yaml
    with:
      service: notifications-service
      version: 1.9.2
      environment: ${{ inputs.environment }}

  orders-api:
    needs:
      - catalog-service
    if: ${{ fromJSON(inputs.manifest)['cloudbees-unify-demo-kit']['orders-api'].deploy }}
    uses: michaelvp411/cloudbees-unify-demo-kit/.cloudbees/workflows/deploy.yaml@main
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['cloudbees-unify-demo-kit']['orders-api'].url }}
      environment: ${{ inputs.environment }}

  checkout-service:
    needs:
      - orders-api
      - payments-service
    uses: ./.cloudbees/workflows/deploy-service.yaml
    with:
      service: checkout-service
      version: 5.1.0
      environment: ${{ inputs.environment }}
